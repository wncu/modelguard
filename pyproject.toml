[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modelguard-local"
version = "0.2.0"
description = "Local-first model supply-chain inspection; no safety certification"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
modelguard = "modelguard.cli:main"
modelguard-mcp = "modelguard.mcp:main"

[tool.setuptools]
packages = ["modelguard"]
